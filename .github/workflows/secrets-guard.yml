name: secrets-guard

# Structural check: every COMMITTED .env profile must hold dotenvx ciphertext.
#
# This is the third of three secret gates, and it exists because the other two
# have shapes it does not:
#   1. .githooks/pre-commit — runs BEFORE the commit, on the developer's machine,
#      and auto-encrypts. Activated by the root package.json `prepare` script.
#      Its `dotenvx ext precommit` backstop only inspects the STAGED diff, so it
#      is a no-op on a plain CI checkout.
#   2. secret-scan.yml (gitleaks) — runs on the PR, i.e. after the push, and is
#      PATTERN-based. In testing it caught INTERNAL_HMAC_SECRET but missed a
#      plaintext `postgres://user:password@host` URL.
# This job is structural: a value either starts with `encrypted:` or it fails,
# whatever the value looks like.

on:
  pull_request:
    branches: [main, staging, prod]

permissions:
  contents: read

jobs:
  env-encrypted:
    name: committed .env profiles are encrypted
    runs-on: ${{ vars.CI_RUNNER_S || 'blacksmith-2vcpu-ubuntu-2404' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every committed .env profile is dotenvx ciphertext
        run: bash scripts/check-env-encrypted.sh

      # Tripwire for the 2026-08-29 finding: the .gitleaks.toml allowlist for the
      # encrypted profiles was path-only, so gitleaks reported "no leaks found"
      # on a plaintext apps/api/.env. A path-only allowlist exempts a whole file.
      # Every allowlist must narrow with `condition = "AND"` plus `regexes`.
      - name: No path-only allowlist in .gitleaks.toml
        run: |
          python3 - <<'PY'
          import re, sys
          text = open('.gitleaks.toml').read()
          blocks = text.split('[[allowlists]]')[1:]
          bad = []
          for i, b in enumerate(blocks, 1):
              if 'paths' in b and not re.search(r'condition\s*=\s*"AND"', b):
                  desc = re.search(r'description\s*=\s*"([^"]{0,70})', b)
                  bad.append(f'  allowlist #{i}: {desc.group(1) if desc else "?"}...')
          if bad:
              print('Path-only gitleaks allowlist(s) — these exempt entire files:')
              print('\n'.join(bad))
              print('\nAdd condition = "AND" and regexes so only the intended')
              print('lines are exempt and a plaintext secret still fails.')
              sys.exit(1)
          print(f'{len(blocks)} allowlist(s), all narrowed with condition = "AND"')
          PY
