# ⚠️ EXPERIMENTAL — NOT SHIPPED. Do not copy this into a real project.
# The ACP transport, `kortix_version: 3`, and the claude/codex/pi harnesses sit
# behind the `KORTIX_ACP_RUNTIME` flag, which defaults to false. They are
# unreleased and unsupported. OpenCode REST + `kortix_version: 2` are the only
# shipped path — see `packages/starter/templates/base/kortix.yaml`.
# yaml-language-server: $schema=https://kortix.com/schema/kortix.v3.schema.json
kortix_version: 3
default_agent: opencode

runtimes:
  opencode:
    harness: opencode
    config_dir: .kortix/opencode
  claude:
    harness: claude
    config_dir: .claude
  codex:
    harness: codex
    config_dir: .codex
  pi:
    harness: pi
    config_dir: .pi

agents:
  opencode:
    runtime: opencode
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
  claude:
    runtime: claude
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
  codex:
    runtime: codex
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
  pi:
    runtime: pi
    connectors: all
    secrets: all
    skills: all
    kortix_cli: all
